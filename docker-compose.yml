services:
  app:
    image: ghcr.io/a-ghost-named-x/track.fox.com:latest
    restart: unless-stopped
    env_file: .env
    # No host port is published. A separate Traefik project owns port 80 on
    # the host and reaches this container over the shared `ingress` network,
    # using the routing rule in these labels. Uvicorn listens on 8000 inside
    # the container.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.track.rule=Host(`track.fox.com`)"
      - "traefik.http.routers.track.entrypoints=web"
      - "traefik.http.services.track.loadbalancer.server.port=8000"
    volumes:
      # Containers default to UTC. Shift logic runs on server-local time, so
      # borrow the host's timezone rather than hardcoding one here.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - ingress

networks:
  # Created by the Traefik project, so it must exist before this file runs.
  ingress:
    external: true

# Postgres runs on its own server (POSTGRES_HOST in .env), not in this file.
