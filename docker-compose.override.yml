# Local development override. Compose merges this with docker-compose.yml
# automatically on `docker compose up`. The deploy workflow only copies
# docker-compose.yml, so nothing here reaches production.
#
# Differences from production:
#   - Builds the image from the local Dockerfile (tagged track-fox-com:dev)
#     instead of pulling from GHCR.
#   - Bind-mounts ./app and runs uvicorn with --reload, so Python, template,
#     CSS and JS edits show up without a rebuild.
#   - Sets TZ. On Docker Desktop the /etc/localtime mount resolves against
#     Docker's own Linux VM (usually UTC), not your machine's clock.
#   - Publishes port 8000. `!override` replaces the inherited ports list
#     instead of appending to it (`!reset` would clear it entirely).
#   - Creates the `ingress` network locally, since the Traefik project that
#     normally creates it doesn't run on a dev machine.
services:
  app:
    build: .
    image: track-fox-com:dev
    environment:
      - TZ=America/Chicago
    ports: !override
      - "8000:8000"
    volumes:
      - ./app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

networks:
  ingress:
    external: false
